{% extends 'layout.html' %}
{% load static %}
{% block title %}Register | TweetBar{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="glass-card p-4 p-lg-5">
            <p class="text-accent text-uppercase small fw-semibold mb-2">Join us</p>
            <h2 class="fw-bold mb-3">Create your TweetBar account</h2>
            <p class="text-muted mb-4">Register via API and start tweeting</p>
            
            <div id="errorAlert" class="alert alert-danger" style="display: none;"></div>
            
            <form id="registerForm" class="row g-3">
                <div class="col-12">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" id="username" class="form-control" required>
                    <div id="usernameError" class="text-danger small mt-1"></div>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" id="email" class="form-control" required>
                    <div id="emailError" class="text-danger small mt-1"></div>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" id="password" class="form-control" minlength="8" required>
                    <div id="passwordError" class="text-danger small mt-1"></div>
                    <small class="text-muted">At least 8 characters</small>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">Confirm Password</label>
                    <input type="password" id="password2" class="form-control" minlength="8" required>
                    <div id="password2Error" class="text-danger small mt-1"></div>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-gradient w-100 py-2" id="submitBtn">
                        Create Account
                    </button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <span class="text-muted">Already have an account?</span>
                <a class="ms-2 btn btn-outline-light btn-sm" href="{% url 'login_api' %}">Sign in</a>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'api.js' %}"></script>
<script>
const api = window.tweetAPI;

document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    
    // Clear previous errors
    document.getElementById('errorAlert').style.display = 'none';
    ['username', 'email', 'password', 'password2'].forEach(field => {
        document.getElementById(field + 'Error').textContent = '';
    });
    
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';
    
    const result = await api.register(username, email, password, password2);
    
    if (result.success) {
        window.location.href = '{% url "tweet_list_api" %}';
    } else {
        if (result.errors.username) {
            document.getElementById('usernameError').textContent = Array.isArray(result.errors.username) 
                ? result.errors.username.join(' ') : result.errors.username;
        }
        if (result.errors.email) {
            document.getElementById('emailError').textContent = Array.isArray(result.errors.email) 
                ? result.errors.email.join(' ') : result.errors.email;
        }
        if (result.errors.password) {
            document.getElementById('passwordError').textContent = Array.isArray(result.errors.password) 
                ? result.errors.password.join(' ') : result.errors.password;
        }
        if (result.errors.password2) {
            document.getElementById('password2Error').textContent = Array.isArray(result.errors.password2) 
                ? result.errors.password2.join(' ') : result.errors.password2;
        }
        if (result.errors.detail) {
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.textContent = result.errors.detail;
            errorAlert.style.display = 'block';
        }
        
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
    }
});

// Check if already logged in
if (api.isAuthenticated()) {
    window.location.href = '{% url "tweet_list_api" %}';
}
</script>
{% endblock %}
