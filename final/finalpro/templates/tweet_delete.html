{% extends 'layout.html' %}
{% block title %}Delete Tweet | TweetBar{% endblock %}
{% block content %}
<div class="glass-card p-4 p-lg-5">
    <p class="text-accent text-uppercase small fw-semibold mb-2">Confirm</p>
    <h2 class="fw-bold mb-3">Delete this tweet?</h2>
    <p class="text-muted mb-4">This action cannot be undone.</p>

    <div class="border border-dark-subtle rounded p-3 mb-4 bg-dark-subtle">
        <p class="mb-2 text-body">{{ tweet.text }}</p>
        {% if tweet.image %}
            <img src="{{ tweet.image.url }}" alt="Tweet image" class="img-fluid rounded">
        {% endif %}
    </div>

    <div class="d-flex justify-content-between">
        <a href="{% url 'tweet_list' %}" class="btn btn-outline-light">Cancel</a>
        <form method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete forever</button>
        </form>
    </div>
</div>
{% endblock %}
