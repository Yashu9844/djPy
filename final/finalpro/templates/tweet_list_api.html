{% extends 'layout.html' %}
{% load static %}
{% block title %}API Feed | TweetBar{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
    <div>
        <p class="text-accent text-uppercase small fw-semibold mb-1">API-Powered</p>
        <h2 class="fw-bold mb-0">Live Tweet Feed</h2>
        <p class="text-muted">Real-time updates via REST API</p>
    </div>
    <div class="d-flex gap-2">
        <input type="text" id="searchInput" class="form-control" placeholder="Search tweets..." style="width: 200px;">
        <button id="createBtn" class="btn btn-gradient" disabled>Compose</button>
    </div>
</div>

<!-- Create/Edit Modal -->
<div id="tweetModal" class="modal-overlay" style="display: none;">
    <div class="glass-card p-4" style="max-width: 600px; margin: 100px auto;">
        <h3 id="modalTitle" class="fw-bold mb-3">Create Tweet</h3>
        <form id="tweetForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Message</label>
                <textarea id="tweetText" class="form-control" rows="4" required></textarea>
                <div id="textError" class="text-danger small mt-1"></div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Image (optional)</label>
                <input type="file" id="tweetImage" class="form-control" accept="image/*">
                <div id="imageError" class="text-danger small mt-1"></div>
            </div>
            <div class="d-flex justify-content-between">
                <button type="button" id="cancelBtn" class="btn btn-outline-light">Cancel</button>
                <button type="submit" class="btn btn-gradient">
                    <span id="submitText">Publish</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Login Prompt -->
<div id="loginPrompt" class="alert alert-info glass-card">
    <strong>Not logged in.</strong> Please <a href="{% url 'login' %}" class="alert-link">login</a> or <a href="{% url 'register' %}" class="alert-link">register</a> to create tweets.
</div>

<!-- Tweets Container -->
<div id="tweetsContainer" class="row g-4">
    <div class="col-12 text-center p-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="text-muted mt-2">Loading tweets...</p>
    </div>
</div>

<!-- Pagination -->
<div id="pagination" class="d-flex justify-content-center gap-2 mt-4"></div>

<style>
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    overflow-y: auto;
}
.tweet-card {
    transition: transform 0.2s;
}
.tweet-card:hover {
    transform: translateY(-2px);
}
</style>

<script src="{% static 'api.js' %}"></script>
<script>
let currentPage = 1;
let editingTweetId = null;
let searchTimeout = null;
const api = window.tweetAPI;

// Check authentication on load
document.addEventListener('DOMContentLoaded', () => {
    checkAuth();
    loadTweets();
    setupEventListeners();
});

function checkAuth() {
    const isAuth = api.isAuthenticated();
    document.getElementById('createBtn').disabled = !isAuth;
    document.getElementById('loginPrompt').style.display = isAuth ? 'none' : 'block';
}

function setupEventListeners() {
    document.getElementById('createBtn').addEventListener('click', () => openModal());
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('tweetForm').addEventListener('submit', handleSubmit);
    document.getElementById('searchInput').addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            currentPage = 1;
            loadTweets(e.target.value);
        }, 500);
    });
}

async function loadTweets(search = '') {
    const container = document.getElementById('tweetsContainer');
    container.innerHTML = '<div class="col-12 text-center p-5"><div class="spinner-border text-primary"></div></div>';
    
    const result = await api.getTweets(currentPage, search);
    if (result && result.results) {
        renderTweets(result.results);
        renderPagination(result);
    } else {
        container.innerHTML = '<div class="col-12 glass-card text-center p-5"><h3>Failed to load tweets</h3></div>';
    }
}

function renderTweets(tweets) {
    const container = document.getElementById('tweetsContainer');
    if (tweets.length === 0) {
        container.innerHTML = `
            <div class="col-12 glass-card text-center p-5">
                <h3 class="fw-bold mb-2">No tweets yet</h3>
                <p class="text-muted">Be the first to share something brilliant.</p>
            </div>
        `;
        return;
    }

    const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    container.innerHTML = tweets.map(tweet => {
        const isOwner = currentUser && tweet.user.id === currentUser.id;
        const date = new Date(tweet.created_at).toLocaleDateString('en-US', {
            month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        
        return `
            <div class="col-12 col-md-6 col-lg-4">
                <article class="glass-card tweet-card h-100 p-4 d-flex flex-column">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <div class="d-flex align-items-center gap-3">
                            <span class="avatar-circle">${tweet.user.username.charAt(0).toUpperCase()}</span>
                            <div>
                                <div class="fw-semibold">${tweet.user.username}</div>
                                <small class="text-muted">${date}</small>
                            </div>
                        </div>
                        ${isOwner ? `
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm btn-outline-light" onclick="editTweet(${tweet.id})">Edit</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteTweet(${tweet.id})">Delete</button>
                            </div>
                        ` : ''}
                    </div>
                    <p class="flex-grow-1 text-body">${escapeHtml(tweet.text)}</p>
                    ${tweet.image ? `
                        <div class="mt-3">
                            <img src="${tweet.image}" alt="Tweet image" class="img-fluid rounded border border-dark-subtle shadow-sm">
                        </div>
                    ` : ''}
                </article>
            </div>
        `;
    }).join('');
}

function renderPagination(result) {
    const container = document.getElementById('pagination');
    if (!result.next && !result.previous) {
        container.innerHTML = '';
        return;
    }

    const totalPages = Math.ceil(result.count / 10);
    let html = '';
    
    if (result.previous) {
        html += `<button class="btn btn-outline-light" onclick="changePage(${currentPage - 1})">Previous</button>`;
    }
    
    html += `<span class="align-self-center text-muted px-3">Page ${currentPage} of ${totalPages}</span>`;
    
    if (result.next) {
        html += `<button class="btn btn-outline-light" onclick="changePage(${currentPage + 1})">Next</button>`;
    }
    
    container.innerHTML = html;
}

function changePage(page) {
    currentPage = page;
    loadTweets(document.getElementById('searchInput').value);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openModal(tweetId = null) {
    editingTweetId = tweetId;
    const modal = document.getElementById('tweetModal');
    const title = document.getElementById('modalTitle');
    const submitText = document.getElementById('submitText');
    
    if (tweetId) {
        title.textContent = 'Edit Tweet';
        submitText.textContent = 'Update';
        // Load tweet data
        api.getTweet(tweetId).then(tweet => {
            if (tweet) {
                document.getElementById('tweetText').value = tweet.text;
            }
        });
    } else {
        title.textContent = 'Create Tweet';
        submitText.textContent = 'Publish';
        document.getElementById('tweetForm').reset();
    }
    
    document.getElementById('textError').textContent = '';
    document.getElementById('imageError').textContent = '';
    modal.style.display = 'block';
}

function closeModal() {
    document.getElementById('tweetModal').style.display = 'none';
    editingTweetId = null;
}

async function handleSubmit(e) {
    e.preventDefault();
    
    const text = document.getElementById('tweetText').value.trim();
    const imageInput = document.getElementById('tweetImage');
    const imageFile = imageInput.files[0] || null;
    
    document.getElementById('textError').textContent = '';
    document.getElementById('imageError').textContent = '';
    
    let result;
    if (editingTweetId) {
        result = await api.updateTweet(editingTweetId, text, imageFile);
    } else {
        result = await api.createTweet(text, imageFile);
    }
    
    if (result.success) {
        closeModal();
        loadTweets(document.getElementById('searchInput').value);
    } else {
        if (result.errors.text) {
            document.getElementById('textError').textContent = Array.isArray(result.errors.text) ? result.errors.text.join(', ') : result.errors.text;
        }
        if (result.errors.image) {
            document.getElementById('imageError').textContent = Array.isArray(result.errors.image) ? result.errors.image.join(', ') : result.errors.image;
        }
        if (result.errors.detail) {
            alert(result.errors.detail);
        }
    }
}

async function editTweet(id) {
    openModal(id);
}

async function deleteTweet(id) {
    if (!confirm('Are you sure you want to delete this tweet?')) return;
    
    const result = await api.deleteTweet(id);
    if (result.success) {
        loadTweets(document.getElementById('searchInput').value);
    } else {
        alert('Failed to delete tweet: ' + (result.errors.detail || 'Unknown error'));
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
